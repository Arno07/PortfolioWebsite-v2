<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antareep Saha Roy | Node graph portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0e12;--panel:#171a21;--line:#2a2f3b;--blue:#2d7dff;--green:#7cff6b;--mag:#ff4fd8;--text:#f2f2f2;--mut:#8b92a1;
--head:'Rajdhani','Arial Narrow',sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 var(--mono)}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3,h5{font-family:var(--head);margin:0;line-height:1.05}
p{color:var(--mut);margin:0 0 14px;max-width:64ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.intro{padding:26px 5vw 12px;max-width:1100px;margin:0 auto}
.intro h1{font-size:clamp(34px,6vw,60px);margin-bottom:8px}
/* graph */
.ng{position:relative;height:470px;margin:10px 5vw 0;border:1px solid var(--line);background:#101114 radial-gradient(#252a36 1px,transparent 1px) 0 0/22px 22px;overflow:auto;touch-action:pan-x pan-y}
.ng svg{position:absolute;left:0;top:0;width:1000px;height:470px;pointer-events:none}
.ng path{fill:none;stroke-width:2.5;stroke-dasharray:8 6;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
.nd{position:absolute;width:200px;background:#1b1f28;border:1px solid #333b4a;cursor:pointer;user-select:none;touch-action:none;transition:border-color .2s,box-shadow .2s}
.nd:hover{border-color:var(--text);box-shadow:0 0 0 3px #ffffff18}
.nd h5{padding:6px 12px;font-size:16px;background:var(--blue)}
.nd.g h5{background:var(--green);color:#0a1a08}.nd.c h5{background:#5fb0b7;color:#06191b}.nd.m h5{background:var(--mag);color:#200a1c}
.nd p{padding:8px 12px;font-size:12px;margin:0;max-width:none}
.nd:before,.nd:after{content:"";position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--text);transform:translateY(-50%)}
.nd:before{left:-6px}.nd:after{right:-6px}
.hint{padding:10px 5vw 40px;color:var(--mut);font-size:13px}
/* page */
#page{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);clip-path:circle(0 at 50% 50%);visibility:hidden;transition:clip-path .65s cubic-bezier(.7,0,.2,1),visibility 0s .65s}
#page.open{clip-path:circle(150% at var(--x,50%) var(--y,50%));visibility:visible;transition:clip-path .65s cubic-bezier(.7,0,.2,1)}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5vw;background:#0d0e12e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.crumbs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.crumbs button{background:none;border:1px solid var(--line);padding:3px 10px;color:var(--mut)}
.crumbs button:hover{color:var(--text);border-color:var(--text)}
.crumbs i{color:var(--line);font-style:normal}
.crumbs b{padding:3px 10px;background:var(--cc,var(--blue));color:#0a0a0a;font-family:var(--head);font-size:15px}
.close{background:none;border:1px solid var(--line);padding:5px 14px}
.close:hover{border-color:var(--text)}
.wrap{max-width:1000px;margin:0 auto;padding:44px 5vw 80px}
.wrap h1{font-size:clamp(40px,8vw,84px);margin-bottom:14px}
.lead{font-size:17px;color:var(--text);opacity:.85;max-width:56ch}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:30px 0;background:var(--panel);border:1px solid var(--line)}
.det div{padding:14px 16px;border-right:1px solid var(--line);position:relative}
.det div:last-child{border:0}
.det div:before{content:"";position:absolute;left:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--cc,var(--blue))}
.det small{display:block;color:var(--mut);font-size:12px}
.media{position:relative;aspect-ratio:16/8;background:linear-gradient(135deg,#1a2a3f,#141a24 55%,#2b1a2c);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:12px;overflow:hidden}
.media:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff08 0 1px,transparent 1px 4px)}
.play{width:70px;height:70px;border-radius:50%;border:2px solid var(--text);display:grid;place-items:center;background:#0006;position:relative;transition:.2s}
.play:hover{transform:scale(1.1);border-color:var(--cc,var(--blue))}
.play:after{content:"";border-left:20px solid var(--text);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
.cap{font-size:12px;color:var(--mut);margin-bottom:46px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-bottom:40px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.wrap h2{font-size:32px;margin-bottom:10px;padding-left:12px;border-left:4px solid var(--cc,var(--blue))}
.dg{background:var(--panel);border:1px solid var(--line);padding:18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dg span{padding:4px 12px;border:1px solid var(--line);font-size:13px}
.dg .hot{background:var(--cc,var(--blue));color:#0a0a0a;border-color:transparent}
.dg em{color:var(--mut);font-style:normal}
.sw{width:28px;height:28px;padding:0!important;border-radius:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:26px}
.card{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;background:var(--panel);border:1px solid var(--line);padding:16px;border-top:4px solid var(--cc,var(--blue))}
.card:hover{border-color:var(--text)}
.card h3{font-size:24px}.card p{margin:6px 0 0;font-size:13px}
.links a{display:inline-block;margin:0 14px 10px 0;padding:10px 18px;border:1px solid var(--text);text-decoration:none}
.links a:hover{background:var(--text);color:var(--bg)}
.next{display:flex;align-items:center;gap:14px;border-top:1px solid var(--line);padding-top:26px}
.next button{background:#1b1f28;border:1px solid #333b4a;padding:0;position:relative;text-align:left;min-width:220px}
.next button:hover{border-color:var(--text)}
.next h5{padding:6px 12px;background:var(--cc,var(--blue));color:#0a0a0a;font-size:16px}
.next span{display:block;padding:8px 12px;font-size:12px;color:var(--mut)}
.next:before{content:"Next node";font-size:12px;color:var(--mut)}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 40px}
.gal .media{aspect-ratio:16/10;margin:0}
.gl{position:relative;font-size:12px;color:var(--mut)}
.sec{margin-bottom:34px}
.wrap ul{color:var(--mut);padding-left:20px;max-width:64ch;margin:0}
.wrap li{margin-bottom:8px}.wrap li b{color:var(--text);font-weight:500}
.wrap table{border-collapse:collapse;width:100%;max-width:820px;font-size:13px}
.wrap th,.wrap td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top;color:var(--mut)}
.wrap th,.wrap td:first-child{color:var(--text)}
.wrap th{background:var(--panel);font-family:var(--head);font-size:16px;font-weight:600}
.gal .gl{position:absolute;left:12px;bottom:10px}.gal .play{width:54px;height:54px}
.gal.one{grid-template-columns:minmax(0,560px);margin:14px 0 6px}
video.media{display:block;width:100%;height:auto;object-fit:contain;background:#000}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="graph">
  <div class="intro"><h1>Antareep Saha Roy</h1><p>Unreal Engine developer and UI/UX designer. This site is a Blueprint graph: click any node to open its page, drag to rearrange.</p></div>
  <div class="ng" id="ng"><svg id="wires"></svg></div>
  <div class="hint">Tip: press Esc on any page to return to the graph.</div>
</div>
<div id="page" aria-live="polite"><div class="bar"><div class="crumbs" id="crumbs"></div><button class="close" id="close">Back to graph</button></div><div class="wrap" id="wrap"></div></div>

<script>
const D={
begin:{t:'Begin Play',c:'#2d7dff',sum:'I design and build in Unreal Engine.',role:'Developer & UI/UX designer',eng:'Unreal Engine 5',tech:'Blueprints, UMG, PCG, C++, HLSL',st:'Open to work',prob:'I taught myself game development next to a computer science degree in AI and ML. That mix shows in how I design systems: data-driven, reusable and easy to debug.',sol:'I lead design and programming on an indie survival game, and I design the UI/UX for various product configurators. Both need clean architecture and fast iteration.',next:'projects'},
projects:{t:'Projects',c:'#ff4fd8',sum:'Four bodies of work: an ongoing game, the systems behind it, my earlier Unreal projects and the applications I built.',list:['chander','gameplay','earlier','applications'],next:'chander'},
chander:{t:'Chander Pahar',c:'#7cff6b',sum:'A first-person narrative survival-exploration game adapted from Bibhutibhushan Bandyopadhyay’s 1937 Bengali novel. Follow Shankar into the African wilderness.',role:'Design & programming lead',eng:'Unreal Engine 5',tech:'Blueprints and C++',st:'In development',cap:'Trailer or gameplay capture goes here.',diag:'<span>Heightmap</span><em>→</em><span>Landscape</span><em>→</em><span>Biome dressing</span><em>→</em><span>Data Layers</span><em>→</em><span class="hot">Seamless world</span>',secs:[['About the game','<ul><li>First-person narrative survival-exploration on Unreal Engine 5, for Windows PC.</li><li>Adapted from the 1937 Bengali novel, set in Africa in 1909.</li><li>No minimap, no markers: you read the land.</li><li>Premium single purchase. Vertical slice planned for Summer 2027.</li></ul>'],['Trailer and gameplay','v',['Announcement trailer','Gameplay reel','Navigation and journal']],['Design pillars','<ul><li><b>Read the land, not the HUD.</b></li><li><b>Every bullet, every step, has a cost.</b></li><li><b>Danger is rare, and rare things are frightening.</b></li></ul>'],['Environment screenshots','i',['vid:Assets/RainforestBiome.mp4|Congo rainforest','vid:Assets/CP_Savannah.mp4|Kenya grasslands','Volcanic highland','Kalahari desert','Richtersveld caves','River and tributaries']],['Five biomes','<div class="dg"><span>Kenya Grasslands</span><span>Congo Rainforest</span><span>Volcanic Highland</span><span>Desert (Kalahari)</span><span>Cave System (Richtersveld)</span></div>'],['Biome development','v',['Landscape blockout','Foliage and lighting pass','Water and river system','vid:Assets/RainExample.mp4|Rain system demo']],['Gameplay systems','<div class="dg"><span>Companion AI</span><span>Wildlife AI</span><span>Bolt-action rifle</span><span>Navigation and journal</span><span>Narrative director</span><span>Camp and save</span></div>'],['Systems in action','v',['Diego companion AI','Rifle firing and reload','Wildlife behavior','Steam train']],['Raw development','i',['Early prototype','Material and shader tests','Blueprint graphs','Animation setup','Level blockout','Work in progress']],['Optimization','<ul><li>Target: 1440p at 60 fps on an RTX 3060.</li><li>World Partition streaming, Nanite and Lumen tuning.</li><li>Texture streaming and foliage LOD reduction.</li></ul>'],['Optimization captures','i',['Before and after profiling','World Partition cell view','Foliage LOD comparison']],['Roadmap','<p>Prototype, then a 30-minute vertical slice in Summer 2027, and the full game by Fall 2028.</p>']],next:'gameplay'},
gameplay:{t:'Gameplay Systems',c:'#7cff6b',sum:'Reusable systems I designed and built: wildlife AI, a custom bolt-action rifle, survival stats, horror mechanics and interactions and some older gameplay systems.',role:'Gameplay designer & programmer',eng:'Unreal Engine 5',tech:'Blueprints, Behavior Trees, EQS',st:'Reused across projects',cap:'Capture of a system in action goes here.',diag:'<span class="hot">Animal AI</span><span>Bolt-action rifle</span><span>Hunger and survival</span><span>Weeping Angel</span><span>Interactions</span>',secs:[['Animal AI','<p>A state-driven wildlife system. One function evaluates the state and writes it to the Blackboard, and the Behavior Tree only reacts. Predators and prey share the same architecture.</p><video class="media" controls autoplay muted preload="metadata" playsinline style="max-width:560px;margin-top:14px" src="Assets/CP_Elephants.mp4"></video><div class="cap" style="margin-bottom:6px">Elephants</div>'],['Bolt-action rifle','<p>A custom firing system built around the weapon’s own cycle: aim, fire, work the bolt, reload.</p><div class="gal one"><div class="media"><span class="gl">Bolt-action rifle: video or picture goes here</span></div></div>'],['Hunger and survival','<p>One survival component owns every stat, and the HUD and AI only listen to it.</p><div class="gal one"><div class="media"><span class="gl">Hunger and survival: video or picture goes here</span></div></div>'],['Weeping Angel','<p>From an earlier horror game: an enemy that only moves while the player is not looking at it, driven by a visibility check.</p><video class="media" controls autoplay muted preload="metadata" playsinline style="max-width:560px;margin-top:14px" src="Assets/WeepingAngle.mp4"></video><div class="cap" style="margin-bottom:6px">Weeping Angel demo</div>'],['Interaction systems','<p>A shared interaction approach, so doors, pickups and story objects all work the same way.</p><div class="gal one"><div class="media"><span class="gl">Interaction systems: video or picture goes here</span></div></div>']],next:'earlier'},
earlier:{t:'Earlier Projects',c:'#7cff6b',sum:'My first Unreal projects, made while I was learning the engine.',role:'Developer',eng:'Unreal Engine',tech:'Blueprints',st:'Learning projects',secs:[['Unreal learning projects','<p>Older projects made while learning Unreal Engine.</p><div class="gal"><div><video class="media" controls autoplay muted preload="metadata" playsinline src="Assets/ToonTanks.mp4"></video><div class="cap" style="margin:6px 0 0">Toon Tanks</div></div><div><video class="media" controls autoplay muted preload="metadata" playsinline src="Assets/SpaceShooter.mp4"></video><div class="cap" style="margin:6px 0 0">Space Shooter</div></div><div><video class="media" controls autoplay muted preload="metadata" playsinline src="Assets/CryptRaidar.mp4"></video><div class="cap" style="margin:6px 0 0">Crypt Raider</div></div></div>']],next:'applications'},applications:{t:'Applications',c:'#7cff6b',sum:'Neutron, a game engine I built, and a 2D map editor.',role:'Developer',eng:'Custom engine, Java AWT',tech:'C++, OpenGL, Java AWT',st:'Learning projects',secs:[['Neutron','<p>Neutron is a game engine built using C++ and OpenGL.</p><div class="gal one"><div class="media"><span class="gl">Neutron: video or picture goes here</span></div></div>'],['Tile editor','<p>A 2D map editor built with Java AWT for a 2D game I was making.</p><div class="gal one"><div class="media"><span class="gl">Tile editor: video or picture goes here</span></div></div>']],next:'experience'},

experience:{t:'Experience',c:'#ff4fd8',sum:'UI/UX designer at ThirdVR Solutions, building interactive 3D product configurators in Unreal Engine.',role:'UI/UX designer & developer',eng:'Unreal Engine 5',tech:'UMG, Blueprints, DataTables',stl:'Employment',st:'Full time, 6 months (February 2026 to August 2026)',vid:'Assets/2026-03-07 11-17-20.mp4',vidcap:'Product configurator demo',diag:'<button class="sw" style="background:#ff6a1a" aria-label="Orange"></button><button class="sw" style="background:#38e1ff" aria-label="Cyan"></button><button class="sw" style="background:#d9a441" aria-label="Gold"></button><span class="hot">X-ray</span>',secs:[['What I did','<ul><li>Designed the UI/UX for interactive 3D product configurators at ThirdVR Solutions.</li><li>Built the interfaces in Unreal Engine with UMG and Blueprints.</li><li>Made product lists data-driven with DataTables, so new products are added by editing a data array instead of rebuilding the UI.</li><li>Used dynamic material instances for colour and finish changes.</li><li>Added animated transitions, such as the X-ray view that shows inside a product.</li></ul>'],['Products I worked on','<div class="dg"><span>Cycles</span><span>Engines</span><span>Drones</span><span>AHUs</span><span>BIM menu</span></div>'],['','<p>More work details can be viewed in an online meeting.</p>']],next:'contact'},
contact:{t:'Contact',c:'#5fb0b7',sum:'Have a project or a role in mind? Get in touch.',links:[['Email','mailto:antareepsr2002@gmail.com'],['LinkedIn','https://www.linkedin.com/in/antareep-saha-roy-4b953521b/'],['GitHub','https://github.com/Arno07'],['Steam','https://steamcommunity.com/id/arno69/']],next:'begin'}};
const N=[['begin','',30,160],['projects','m',280,150],['chander','g',540,10],['gameplay','g',540,120],['earlier','g',540,230],['experience','m',280,300],['contact','c',790,340],['applications','g',790,200]];
const blurb={begin:'Who I am and what I build.',projects:'Everything I’ve shipped or am building.',chander:'Narrative survival game from the novel.',gameplay:'Animal AI, weapons, survival, horror.',experience:'UI/UX designer at ThirdVR Solutions.',earlier:'First Unreal projects.',applications:'Neutron engine and 2D map editor.',contact:'Email, LinkedIn, GitHub, Steam.'};
const E=[[0,1],[1,2],[1,3],[1,4],[0,5],[5,6],[4,7]],wc=['#2d7dff','#ff4fd8','#7cff6b','#2d7dff','#ff4fd8','#5fb0b7','#7cff6b'],ng=document.getElementById('ng'),ws=document.getElementById('wires'),pg=document.getElementById('page');
N.forEach(n=>{const d=document.createElement('div');d.className='nd '+n[1];d.tabIndex=0;d.style.left=n[2]+'px';d.style.top=n[3]+'px';
 d.innerHTML=`<h5>${D[n[0]].t}</h5><p>${blurb[n[0]]}</p>`;ng.appendChild(d);n.el=d;
 let sx,sy,moved,ox,oy;
 d.onpointerdown=e=>{d.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;moved=false;ox=e.clientX-d.offsetLeft;oy=e.clientY-d.offsetTop;
  d.onpointermove=m=>{if(Math.hypot(m.clientX-sx,m.clientY-sy)>5)moved=true;if(moved){d.style.left=Math.max(0,Math.min(800,m.clientX-ox))+'px';d.style.top=Math.max(0,Math.min(410,m.clientY-oy))+'px';wire()}}};
 d.onpointerup=e=>{d.onpointermove=null;if(!moved)go(n[0],e.clientX,e.clientY)};
 d.onkeydown=e=>{if(e.key=='Enter'){const b=d.getBoundingClientRect();go(n[0],b.left+b.width/2,b.top+b.height/2)}}});
function wire(){ws.innerHTML=E.map((e,i)=>{const a=N[e[0]].el,b=N[e[1]].el,x1=a.offsetLeft+a.offsetWidth+5,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft-5,y2=b.offsetTop+b.offsetHeight/2,dx=Math.max(50,Math.abs(x2-x1)/2);
 return `<path stroke="${wc[i%wc.length]}" d="M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}"/>`}).join('')}
wire();

function render(id){const p=D[id];pg.style.setProperty('--cc',p.c);document.getElementById('crumbs').innerHTML=
 `<button data-a="close">Begin Play</button>`+(id=='begin'?'':`<i>›</i>${['chander','gameplay','earlier','applications'].includes(id)?'<button data-a="projects">Projects</button><i>›</i>':''}<b>${p.t}</b>`)+(id=='begin'?'<i>›</i><b>About</b>':'');
 let h=`<h1>${p.t}</h1><p class="lead">${p.sum}</p>`;
 if(p.role)h+=`<div class="det"><div><small>Role</small>${p.role}</div><div><small>Engine</small>${p.eng}</div><div><small>Tech</small>${p.tech}</div><div><small>${p.stl||'Status'}</small>${p.st}</div></div>`;
 if(p.vid)h+=`<video class="media" controls autoplay muted preload="metadata" playsinline src="${p.vid}"></video><div class="cap">${p.vidcap||''}</div>`;
 if(p.cap)h+=`<div class="media"><button class="play" aria-label="Play clip"></button></div><div class="cap">${p.cap}</div>`;
 if(p.prob)h+=`<div class="cols"><div><h2>${p.cap?'The problem':'Background'}</h2><p>${p.prob}</p></div><div><h2>${p.cap?'The solution':'How I work'}</h2><p>${p.sol}</p></div></div>`;
 if(p.diag)h+=`<h2>How it fits together</h2><div class="dg" style="margin-bottom:40px">${p.diag}</div>`;
 if(p.gal)h+=`<h2>Raw development</h2><div class="gal">${p.gal.map(g=>`<div class="media"><span class="gl">${g}</span></div>`).join('')}</div>`;
 if(p.secs)h+=p.secs.map(x=>Array.isArray(x[2])?`<div class="sec"><h2>${x[0]}</h2><div class="gal">${x[2].map(g=>g.startsWith('vid:')?`<div><video class="media" controls autoplay muted preload="metadata" playsinline src="${g.slice(4).split('|')[0]}"></video><div class="cap" style="margin:6px 0 0">${g.split('|')[1]||''}</div></div>`:`<div class="media">${x[1]=='v'?'<button class="play" aria-label="Play clip"></button>':''}<span class="gl">${g}</span></div>`).join('')}</div></div>`:`<div class="sec">${x[0]?`<h2>${x[0]}</h2>`:''}${x[1]}</div>`).join('');
 if(p.res)h+=`<h2>Result</h2><p style="margin-bottom:40px">${p.res}</p>`;
 if(p.list)h+=`<div class="cards">${p.list.map(k=>`<button class="card" style="--cc:${D[k].c}" data-a="${k}"><h3>${D[k].t}</h3><p>${D[k].sum}</p></button>`).join('')}</div><div style="height:40px"></div>`;
 if(p.links)h+=`<div class="links">${p.links.map(l=>`<a href="${l[1]}">${l[0]}</a>`).join('')}</div><div style="height:30px"></div>`;
 const nx=D[p.next];h+=`<div class="next"><button data-a="${p.next}"><h5>${nx.t}</h5><span>${blurb[p.next]}</span></button></div>`;
 document.getElementById('wrap').innerHTML=h;pg.scrollTop=0}
function go(id,x,y){if(x!=null){pg.style.setProperty('--x',x+'px');pg.style.setProperty('--y',y+'px')}render(id);pg.classList.add('open');if(location.hash!='#'+id)history.pushState(null,'','#'+id)}
function closeP(){pg.classList.remove('open');if(location.hash)history.pushState(null,'',location.pathname+location.search)}
pg.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;a=='close'?closeP():go(a)});
document.getElementById('close').onclick=closeP;
addEventListener('keydown',e=>{if(e.key=='Escape')closeP()});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);D[id]?(render(id),pg.classList.add('open')):pg.classList.remove('open')});
if(D[location.hash.slice(1)])go(location.hash.slice(1),innerWidth/2,innerHeight/2);
</script>
</body>
</html>
